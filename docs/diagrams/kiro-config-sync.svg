<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>steersync: central Kiro configuration</title>
<defs>
<marker id="m_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F8A70"/></marker>
<marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A77B4"/></marker>
<marker id="m_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D8732E"/></marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="60" y="60" font-size="26" font-weight="700" fill="#1F2933">Central Kiro configuration with steersync</text>
<text x="60" y="88" font-size="15" fill="#52606D">One reviewed copy in GitLab, applied to every workstation</text>
<text x="900" y="88" font-size="16" font-weight="700" fill="#D8732E">GitLab</text>
<rect id="ws" x="60" y="170" width="440" height="380" rx="12" fill="#EEF4FB" stroke="#9DB7D5" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="80" y="204" font-size="18" font-weight="700" fill="#9DB7D5">Developer workstation</text>
<rect id="kiro" x="100" y="230" width="360" height="70" rx="12" fill="#F3EEFB" stroke="#7A5AB8" stroke-width="2"/>
<text x="280.0" y="261" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">Kiro CLI</text>
<text x="280.0" y="283" font-size="13.5" fill="#52606D" text-anchor="middle">reads .kiro/ and ~/.kiro/</text>
<rect id="kirodir" x="100" y="330" width="360" height="80" rx="12" fill="#FFFFFF" stroke="#4A77B4" stroke-width="2"/>
<text x="280.0" y="366" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">.kiro/ in the project clone</text>
<text x="280.0" y="388" font-size="13.5" fill="#52606D" text-anchor="middle">steering, specs, skills, agents, hooks, settings</text>
<rect id="ss" x="100" y="440" width="360" height="70" rx="12" fill="#E6F4F1" stroke="#1F8A70" stroke-width="2"/>
<text x="280.0" y="471" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">steersync</text>
<text x="280.0" y="493" font-size="13.5" fill="#52606D" text-anchor="middle">pull, push, lint; git pre-push hook</text>
<rect id="projrepo" x="900" y="110" width="440" height="90" rx="12" fill="#FFFFFF" stroke="#D8732E" stroke-width="2"/>
<text x="1120.0" y="151" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">Project repository</text>
<text x="1120.0" y="173" font-size="13.5" fill="#52606D" text-anchor="middle">entra-app-registration: application code only</text>
<rect id="central" x="900" y="310" width="440" height="240" rx="12" fill="#FDF1E7" stroke="#D8732E" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="920" y="344" font-size="18" font-weight="700" fill="#D8732E">Central repository: kiro-config</text>
<rect id="main" x="930" y="370" width="380" height="60" rx="12" fill="#FFFFFF" stroke="#D8732E" stroke-width="2"/>
<text x="1120.0" y="396" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">main</text>
<text x="1120.0" y="418" font-size="13.5" fill="#52606D" text-anchor="middle">global/  and  projects/&lt;project&gt;/</text>
<rect id="mr" x="930" y="460" width="380" height="60" rx="12" fill="#FFFFFF" stroke="#D8732E" stroke-width="2"/>
<text x="1120.0" y="486" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">merge request</text>
<text x="1120.0" y="508" font-size="13.5" fill="#52606D" text-anchor="middle">reviewed by platform and security owners</text>
<path id="e_code" d="M 500 200 L 900 155" fill="none" stroke="#4A77B4" stroke-width="2.5" marker-end="url(#m_blue)"/>
<text x="700" y="166" font-size="14" fill="#4A77B4" text-anchor="middle">git push (code)</text>
<path id="e_push" d="M 500 490 L 930 490" fill="none" stroke="#1F8A70" stroke-width="2.5" marker-end="url(#m_teal)"/>
<text x="715" y="478" font-size="14" fill="#1F8A70" text-anchor="middle">steersync push: opens a merge request</text>
<path id="e_merge" d="M 1120 460 L 1120 430" fill="none" stroke="#D8732E" stroke-width="2.5" marker-end="url(#m_orange)"/>
<text x="1132" y="450" font-size="14" fill="#D8732E">review, merge</text>
<path id="e_pull" d="M 900 385 L 500 385" fill="none" stroke="#1F8A70" stroke-width="2.5" marker-end="url(#m_teal)"/>
<text x="700" y="373" font-size="14" fill="#1F8A70" text-anchor="middle">steersync pull: applies merged main</text>
<line x1="60" y1="610" x2="1340" y2="610" stroke="#D9DEE3"/>
<text x="60" y="648" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" fill="#52606D" xml:space="preserve">steersync init --hook   |   steersync pull   |   edit .kiro/ ... git push  (hook runs steersync push)   |   review and merge in GitLab</text>
</svg>
