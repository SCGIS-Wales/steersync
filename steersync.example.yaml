# Example steersync configuration.
# Copy to <repo>/.kiro/steersync.yaml (per project) or ~/.config/steersync/config.yaml (per user).
# Any key omitted here keeps the packaged default; see `steersync config default`.

remote:
  url: git@gitlab.example.com:platform/kiro-steering.git
  default_branch: main
  global_dir: global
  projects_dir: projects
  allowed_hosts:
    - gitlab.example.com
  push_options:
    - merge_request.create
    - merge_request.target={default_branch}
    - merge_request.remove_source_branch
    - "merge_request.title=kiro-config: update {project} from {user}"
    - merge_request.label=steering

git:
  timeout_seconds: 120
  clone_depth: 1
  retries: 2
  retry_backoff_seconds: 2.0
  retry_max_backoff_seconds: 30.0

branch:
  template: "kiro-config/{project}/{user}-{hash}"
  hash_length: 8
  user_from: [os, email, name]  # operating system user first, then git email, then git name
  warn_existing: true           # list other unmerged proposals for the project before pushing

gitlab:
  token_env: GITLAB_TOKEN       # the token itself is never written to a file
  api_url: ""                   # derived from remote.url: https://gitlab.example.com/api/v4
  project: ""                   # derived from remote.url: platform/kiro-steering
  target_branch: ""             # defaults to remote.default_branch
  auto_merge_request: true
  labels: [kiro-config]

# Collections are merged over the packaged defaults (steering, specs, skills, agents,
# hooks, settings); list only what differs. See `steersync config default` for every key.
collections:
  settings:
    include: [lsp.json]           # keep mcp.json local to each machine
  runbooks:
    description: Operational runbooks shared through the central repository
    workspace_path: docs/runbooks
    central_dir: runbooks
    include: ["**/*.md"]
    lint: markdown
    git_exclude: false

sync:
  prune: true
  strict_pull: false
  offline_fallback: true
  lock_timeout_seconds: 120
  max_files: 1000
  max_total_bytes: 10485760

lint:
  max_file_bytes: 65536
  require_h1: true
  practices: true               # best practice warnings from the Kiro documentation
  practice_limits:
    always_total_bytes: 49152
  pymarkdown:
    enabled: true
    severity: warning
    disabled_rules: [MD013, MD041]

hook:
  strict: false
  timeout_seconds: 60

logging:
  level: INFO
  format: text
