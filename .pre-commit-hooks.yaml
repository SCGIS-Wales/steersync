# Hook definitions consumed by projects that add steersync to their .pre-commit-config.yaml.
- id: steersync-push
  name: steersync push (.kiro/steering to central repository)
  description: Propose workspace steering to the central repository before a push. Never blocks the push unless STEERSYNC_STRICT=1.
  entry: steersync push --from-hook
  language: python
  stages: [pre-push]
  pass_filenames: false
  always_run: true
  minimum_pre_commit_version: "3.2.0"
- id: steersync-lint
  name: steersync lint (.kiro/steering)
  description: Validate steering front matter, size, references and secrets.
  entry: steersync lint
  language: python
  files: ^\.kiro/steering/.*\.md$
  pass_filenames: true
  minimum_pre_commit_version: "3.2.0"
