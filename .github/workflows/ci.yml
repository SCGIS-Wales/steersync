name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_to_pypi:
        description: Publish the distribution built by this run to PyPI (Release workflow only).
        type: boolean
        default: false
      version:
        description: Package version the distribution must carry when publishing.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  TWINE_VERSION: "7.0.0"
  ACTIONLINT_VERSION: "1.7.12.25"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Ruff lint
        run: uv run ruff check --output-format github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Lint GitHub workflows (actionlint with shellcheck)
        run: uvx --from "actionlint-py==${ACTIONLINT_VERSION}" actionlint

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Configure git identity for integration tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Bandit static analysis
        run: uv run bandit -c pyproject.toml -r src -ll
      - name: Export locked requirements
        run: uv export --locked --all-extras --no-dev --no-emit-project --format requirements-txt -o requirements.lock.txt
      - name: pip-audit against the lock file
        run: uv run pip-audit --strict --progress-spinner off -r requirements.lock.txt
      - name: Lint the shipped steering examples with steersync itself
        run: uv run steersync lint docs/examples

  dependency-review:
    # Needs the repository's Dependency graph (Settings, Code security). Enable it,
    # then set the repository variable DEPENDENCY_REVIEW to "true".
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, security]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx --from "twine==${TWINE_VERSION}" twine check --strict dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv --python "${PYTHON_VERSION}" "${RUNNER_TEMP}/smoke"
          uv pip install --python "${RUNNER_TEMP}/smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/steersync" --version
          "${RUNNER_TEMP}/smoke/bin/steersync" config default >/dev/null
          "${RUNNER_TEMP}/smoke/bin/steersync" lint docs/examples
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    # The PyPI trusted publisher for the steersync project is registered for this
    # workflow file, so the job that exchanges the OIDC token has to live here. It
    # only runs when the Release workflow calls CI with publish_to_pypi, after the
    # build job has twine checked and smoke tested the very files it uploads.
    name: Publish to PyPI (trusted publishing)
    if: inputs.publish_to_pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/steersync/${{ inputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the built version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::publish_to_pypi needs the version input"
            exit 1
          fi
          test -f "dist/steersync-${VERSION}-py3-none-any.whl"
          test -f "dist/steersync-${VERSION}.tar.gz"
          ls -l dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          # A re-run after a failed GitHub release step must not fail on files
          # that the first run already uploaded.
          skip-existing: true
