name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_SYSTEM_CERTS: "1"

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify the tag matches the package version
        id: version
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/steersync/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/steersync/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" dist/* --title "steersync ${VERSION}" --notes-file release-notes.md --verify-tag
