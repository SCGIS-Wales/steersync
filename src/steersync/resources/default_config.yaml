# Default steersync configuration. User configuration files are deep merged over
# these values. Environment variables override individual settings; see README.
remote:
  # URL of the central steering repository. SSH or HTTPS. Authentication is
  # handled by the git binary (ssh-agent or credential helper), never by steersync.
  url: ""
  default_branch: main
  # Directory in the central repository holding steering applied to every workspace.
  global_dir: global
  # Directory in the central repository holding per project steering, keyed by project slug.
  projects_dir: projects
  # Optional allow list of remote hosts. Empty means any host is accepted.
  allowed_hosts: []
  # Allow file:// and absolute local paths. Only for tests and offline evaluation.
  allow_local: false
  # Git push options sent with each proposal branch. Placeholders: {default_branch},
  # {project}, {user}, {hash}. GitLab turns these into a merge request; other
  # servers ignore them silently.
  push_options:
    - merge_request.create
    - merge_request.target={default_branch}
    - merge_request.remove_source_branch
    - "merge_request.title={title}"

git:
  binary: git
  # Per invocation timeout. Network operations (clone, fetch, ls-remote, push)
  # are retried on transient failures with exponential backoff and jitter.
  timeout_seconds: 120
  clone_depth: 1
  retries: 2
  retry_backoff_seconds: 2.0
  retry_max_backoff_seconds: 30.0

branch:
  # Proposal branch on the central repository. Placeholders: {project} (slug of the
  # project repository), {user}, {hash} (digest of every synced file). The prefix up
  # to {user} is used to find other open proposals for the same project.
  template: "kiro-config/{project}/{user}-{hash}"
  hash_length: 8
  # Where {user} comes from, first match wins: os (the operating system user name,
  # letters and digits only), email (local part of git user.email), name (git user.name).
  user_from: [os, email, name]
  # Warn when another proposal branch for the same project is still on the remote.
  warn_existing: true

# Merge requests through the GitLab API. Everything is optional: push options already
# open a merge request on GitLab; the API is used to report its URL, to open one when
# push options were not accepted, and to list open proposals for the project.
gitlab:
  # Environment variable holding a token with the api scope. Never put the token here.
  token_env: GITLAB_TOKEN
  # Derived from remote.url when empty, e.g. https://gitlab.example.com/api/v4
  api_url: ""
  # Derived from remote.url when empty, e.g. platform/kiro-config
  project: ""
  # Defaults to remote.default_branch
  target_branch: ""
  auto_merge_request: true
  remove_source_branch: true
  squash: false
  labels: [kiro-config]
  timeout_seconds: 30
  # Transient API failures (these statuses, timeouts, resets) are retried with exponential
  # backoff and jitter; 429 honours Retry-After, 500 is retried for reads only, 401 and 403
  # never. Creating a merge request is never repeated blindly.
  retries: 3
  retry_statuses: [429, 502, 503, 504]
  retry_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  # GitLab can answer 404 for a branch or merge request just after a push: retry reads twice.
  retry_not_found: true

paths:
  # Resolved against KIRO_HOME when set, else ~/.kiro
  global_lock: steersync.lock.json
  cache_dir: ~/.cache/steersync

# Collections are the kinds of Kiro content that are synced. Each one maps a
# workspace directory (relative to the repository root) and, optionally, a global
# directory (relative to KIRO_HOME, default ~/.kiro) onto a directory in the
# central repository: global/<central_dir>/ and projects/<slug>/<central_dir>/.
#
# include and exclude are glob patterns relative to the collection directory
# (** spans directories). lint selects the validation profile: steering, markdown,
# skill, agent, hooks, settings, prompt, workflow, kiroignore, json or generic. Set
# enabled: false to switch a collection off, or add a new key to sync something
# else. Hidden directories are never synced; a hidden file is synced only when an
# include pattern names it literally (**/.kiroignore). Collections may share a
# directory when each names its files literally and the names do not overlap.
collections:
  steering:
    description: Kiro steering documents
    workspace_path: .kiro/steering
    global_path: steering
    central_dir: steering
    include: ["**/*.md"]
    lint: steering
  specs:
    description: Spec driven development (requirements or bugfix, design, tasks and metadata)
    workspace_path: .kiro/specs
    global_path: null
    central_dir: specs
    # Every file in a spec directory travels with it, not only the markdown.
    include: ["**/*"]
    exclude: ["**/__pycache__/**", "**/node_modules/**", "**/*.bak", "**/*.tmp"]
    lint: spec
  skills:
    description: Agent Skills (SKILL.md with scripts, references and assets)
    workspace_path: .kiro/skills
    global_path: skills
    central_dir: skills
    include: ["**/*"]
    exclude: ["**/__pycache__/**", "**/node_modules/**"]
    lint: skill
  agents:
    description: Custom agent definitions and their prompt files
    workspace_path: .kiro/agents
    global_path: agents
    central_dir: agents
    include: ["**/*.json", "**/*.md"]
    # Backups written by /upgrade-agent and the automatic V3 upgrade stay local.
    exclude: ["**/*.json.bak", "**/*.bak"]
    lint: agent
  hooks:
    description: Standalone Kiro hooks (V3 and IDE 1.0; legacy .kiro.hook files are flagged)
    workspace_path: .kiro/hooks
    global_path: hooks
    central_dir: hooks
    include: ["**/*.json", "**/*.kiro.hook"]
    lint: hooks
  settings:
    description: Workspace settings (MCP servers, language servers)
    workspace_path: .kiro/settings
    global_path: null
    central_dir: settings
    include: ["lsp.json", "mcp.json"]
    lint: settings
  sandbox:
    description: Project sandbox policy (.kiro/settings/sandbox.json; can only tighten the global one)
    workspace_path: .kiro/settings
    global_path: null
    central_dir: sandbox
    include: ["sandbox.json"]
    lint: settings
  cli-settings:
    # Opt in: team defaults for kiro-cli (chat.defaultAgent, compaction thresholds).
    # Global only keys such as chat.agentEngine are rejected by the linter.
    enabled: false
    description: Workspace kiro-cli settings (.kiro/settings/cli.json)
    workspace_path: .kiro/settings
    global_path: null
    central_dir: cli-settings
    include: ["cli.json"]
    lint: settings
  workflows:
    description: Workflow recipes (.kiro/workflows/<name>.workflow.json, .yaml or .yml)
    workspace_path: .kiro/workflows
    global_path: workflows
    central_dir: workflows
    include: ["**/*.workflow.json", "**/*.workflow.yaml", "**/*.workflow.yml"]
    lint: workflow
  prompts:
    description: Saved prompts (slash commands, @prompt-name)
    workspace_path: .kiro/prompts
    global_path: prompts
    central_dir: prompts
    include: ["**/*.md"]
    lint: prompt
  knowledge:
    # Team knowledge notes retrieved through a Kiro knowledge base (the knowledge tool),
    # never loaded as steering. Off by default; enable it and choose the folder here, then
    # `steersync init --only knowledge` adds the routing steering and the agent.
    description: Team knowledge notes for a Kiro knowledge base
    enabled: false
    workspace_path: .kiro/knowledge
    global_path: null
    central_dir: knowledge
    include: ["**/*.md"]
    lint: knowledge
  agents-md:
    description: AGENTS.md files anywhere in the repository (each one scoped to its directory)
    workspace_path: .
    global_path: null
    central_dir: agents-md
    include: ["**/AGENTS.md"]
    exclude: &workspace_wide_exclude
      - "**/node_modules/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/target/**"
      - "**/__pycache__/**"
    lint: markdown
    git_exclude: false
  kiroignore:
    description: .kiroignore files (gitignore syntax; paths the agent must not read)
    workspace_path: .
    # ~/.kiro/settings/kiroignore is the global file.
    global_path: settings
    central_dir: kiroignore
    include: ["**/.kiroignore", "kiroignore"]
    exclude: *workspace_wide_exclude
    lint: kiroignore
    git_exclude: false

# Never synced, by design: ~/.kiro/workspace-roots/** and permissions.yaml (Kiro keeps
# workspace permissions per user so a cloned repository cannot inject rules),
# ~/.kiro/powers/**, ~/.kiro/memories/**, ~/.kiro/sessions/**, ~/.kiro/crew/**,
# ~/.kiro/settings/cli.json, managed-settings.json and knowledge base indexes.

# `steersync fleet`: every repository steersync has seen on this machine. The registry
# and backups live in $XDG_STATE_HOME/steersync (~/.local/state/steersync).
# Commands that change state show one plan and ask once.
ux:
  confirm_after_select: false   # enter on the checkbox is the approval
  remember_selection: true      # preselect the last accepted steps (setup.last)
  show_undo_hint: true          # end with "Undo with: steersync restore <backup id>"

fleet:
  # How deep `steersync fleet scan` looks below each root for git repositories.
  scan_max_depth: 4
  # Parallel status workers; 0 picks min(8, number of CPUs).
  max_workers: 0
  # A central cache younger than this is shown without refreshing it first.
  refresh_max_age_seconds: 300
  # Backups taken before a forced pull: kept this many days, and at most this many bytes.
  backup_keep_days: 14
  backup_max_bytes: 536870912

# steersync supports the Kiro V3 harness only. Older kiro-cli releases or another
# chat.agentEngine are reported by `steersync doctor --kiro` (exit 10 with --strict).
kiro:
  min_cli_version: "3.1.0"   # documented file:// resource limits start here
  min_ide_version: "1.4.86"

sync:
  # Delete locally managed files that disappeared from the central repository.
  prune: true
  # Fail a pull when the remote content has lint errors.
  strict_pull: false
  # When the central repository is unreachable and a cache clone exists, pull from
  # the cached default branch and warn instead of failing.
  offline_fallback: true
  # Wait this long for another steersync process using the same cache clone.
  lock_timeout_seconds: 120
  # Safety limits for content read from the central repository.
  max_files: 1000
  max_total_bytes: 10485760

lint:
  # Best practice warnings taken from the Kiro documentation (never errors). The
  # thresholds below back the size based ones; see docs/validation.md.
  practices: true
  practice_limits:
    always_file_bytes: 16384
    always_total_bytes: 49152
    auto_description_min_chars: 20
    skill_name_max_chars: 64
    skill_description_max_chars: 1024
    skill_body_max_lines: 500
    hook_timeout_max_seconds: 300
    prompt_name_max_chars: 50
  require_h1: true
  file_reference_check: true
  pymarkdown:
    enabled: true
    severity: warning
    disabled_rules:
      - MD013   # line length is not meaningful for prose steering
      - MD041   # first line heading is handled by require_h1 with front matter awareness
  # Kiro native front matter keys versus organisational metadata (fm-* rules).
  frontmatter:
    metadata_placement: embedded    # embedded | sidecar (.kiro/steersync.meta.yaml)
    metadata_key: metadata
    allowed_extra_keys: []
    metadata_fields:
      owner:       { pattern: "^@?[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)?$" }
      tags:        { list: true, separator: ",", allowed: [] }   # empty list allows any tag
      references:  { list: true, separator: " ", pattern: "^(https://|#\\[\\[(file|folder):)" }
      review-by:   { type: date, warn_when_past: true }
      verified-on: { type: date }
      status:      { enum: [draft, active, partial, superseded, deprecated] }
      version:     { pattern: "^\\d+\\.\\d+(\\.\\d+)?$" }
    knowledge_keys: [title, domain, verified_on, sources, relations]
    sidecar: .kiro/steersync.meta.yaml
  # Context budgets (steering-size, skill-size, steering-dup-rule).
  budgets:
    always_chars: 49152
    skill_lines: 500
    skill_tokens: 5000
    chars_per_token: 4
    dup_rule_min_chars: 24
  # Findings at or above this severity make `steersync lint` exit 4.
  fail_level: error
  # steersync lint --fix: safe fixes apply after a backup; unsafe ones need
  # --unsafe-fixes or a selection; never means report only.
  fix:
    engine: pymarkdown        # pymarkdown | builtin
    safety:
      file-bom: safe
      file-eol: safe
      fm-leading-blank: safe
      fm-key-case: safe
      fm-inclusion-case: safe
      json-format: safe
      fm-inclusion-typo: unsafe
      fm-quote-glob: unsafe
      fm-filematch-comma: unsafe
      fm-auto-name: unsafe
      fm-move-to-metadata: unsafe
      skill-name-case: unsafe
    extend_safe_fixes: []
    extend_unsafe_fixes: []
    unfixable: []
    max_passes: 100
    require_clean_git: true
  # Knowledge notes (kn-* rules).
  knowledge:
    summary_within_lines: 5
    frontmatter_chars: 600
    section_words: 250
    max_age_days: 90
  # spec-ears (info): acceptance criteria in EARS form.
  spec:
    criteria_heading: "(?i)^#+\\s*acceptance criteria"
    ears_pattern: "(?i)^(WHEN|IF|WHILE|WHERE|THE)\\b.*\\bSHALL\\b"
  # Documented Kiro limits for file:// agent resources: more files or characters than
  # this are truncated or skipped (agent-resource-budget warns before that happens).
  kiro_limits:
    agent_file_resources_max: 32
    agent_file_resources_chars: 100000
    file_chars_truncate: 50000
    file_bytes_skip: 1048576
  # Top level keys of a Kiro V3 agent. Any other key is an error in a JSON agent and a
  # warning in a Markdown agent's front matter.
  agent_fields: [name, description, prompt, model, tools, excludedTools, permissions,
                 resources, mcpServers, hooks, includeMcpJson, includePowers, welcomeMessage]
  # Agent keys V3 does not read, and their V3 replacement (agent-legacy-key).
  legacy_agent_keys:
    allowedTools: permissions
    toolsSettings: permissions
    toolAliases: tools and excludedTools
    keyboardShortcut: nothing (removed in V3)
  # Keys /upgrade-agent (Kiro CLI 3.5) keeps or adds next to "permissions" in an upgraded
  # agent: accepted there, and legacy only in an agent without "permissions".
  upgraded_agent_keys: [allowedTools, toolsSettings, kiroUpgrade]
  forbidden_patterns:
    - id: aws-access-key
      pattern: "(?<![A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])"
      message: AWS access key identifier
    - id: private-key
      pattern: "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY"
      message: Private key material
    - id: github-token
      pattern: "gh[pousr]_[A-Za-z0-9]{36,}"
      message: GitHub token
    - id: gitlab-token
      pattern: "glpat-[A-Za-z0-9_-]{20,}"
      message: GitLab personal access token
    - id: slack-token
      pattern: "xox[abpr]-[0-9A-Za-z-]{10,}"
      message: Slack token
    - id: generic-secret
      pattern: "(?i)(api[_-]?key|secret|password|token)\\s*[:=]\\s*['\"][A-Za-z0-9/+_=-]{16,}['\"]"
      message: Possible hard coded credential

hook:
  # When true the pre-push hook aborts the project push if steering sync fails.
  strict: false
  # Per git call timeout while running from a hook, so a slow server never
  # stalls the developer's push for long.
  timeout_seconds: 60

logging:
  level: INFO
  format: text
