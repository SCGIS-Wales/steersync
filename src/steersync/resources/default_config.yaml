# Default steersync configuration. User configuration files are deep merged over
# these values. Environment variables override individual settings; see README.
remote:
  # URL of the central steering repository. SSH or HTTPS. Authentication is
  # handled by the git binary (ssh-agent or credential helper), never by steersync.
  url: ""
  default_branch: main
  # Directory in the central repository holding steering applied to every workspace.
  global_dir: global
  # Directory in the central repository holding per project steering, keyed by project slug.
  projects_dir: projects
  # Optional allow list of remote hosts. Empty means any host is accepted.
  allowed_hosts: []
  # Allow file:// and absolute local paths. Only for tests and offline evaluation.
  allow_local: false
  # Git push options sent with each proposal branch. Placeholders: {default_branch},
  # {project}, {user}, {hash}. GitLab turns these into a merge request; other
  # servers ignore them silently.
  push_options:
    - merge_request.create
    - merge_request.target={default_branch}
    - merge_request.remove_source_branch
    - "merge_request.title=kiro-config: update {project} from {user}"

git:
  binary: git
  # Per invocation timeout. Network operations (clone, fetch, ls-remote, push)
  # are retried on transient failures with exponential backoff and jitter.
  timeout_seconds: 120
  clone_depth: 1
  retries: 2
  retry_backoff_seconds: 2.0
  retry_max_backoff_seconds: 30.0

branch:
  # Proposal branch on the central repository. Placeholders: {project} (slug of the
  # project repository), {user}, {hash} (digest of every synced file). The prefix up
  # to {user} is used to find other open proposals for the same project.
  template: "kiro-config/{project}/{user}-{hash}"
  hash_length: 8
  # Where {user} comes from, first match wins: os (the operating system user name,
  # letters and digits only), email (local part of git user.email), name (git user.name).
  user_from: [os, email, name]
  # Warn when another proposal branch for the same project is still on the remote.
  warn_existing: true

# Merge requests through the GitLab API. Everything is optional: push options already
# open a merge request on GitLab; the API is used to report its URL, to open one when
# push options were not accepted, and to list open proposals for the project.
gitlab:
  # Environment variable holding a token with the api scope. Never put the token here.
  token_env: GITLAB_TOKEN
  # Derived from remote.url when empty, e.g. https://gitlab.example.com/api/v4
  api_url: ""
  # Derived from remote.url when empty, e.g. platform/kiro-config
  project: ""
  # Defaults to remote.default_branch
  target_branch: ""
  auto_merge_request: true
  remove_source_branch: true
  squash: false
  labels: [kiro-config]
  timeout_seconds: 30

paths:
  workspace_lock: .kiro/steersync.lock.json
  # Resolved against KIRO_HOME when set, else ~/.kiro
  global_lock: steersync.lock.json
  cache_dir: ~/.cache/steersync

# Collections are the kinds of Kiro content that are synced. Each one maps a
# workspace directory (relative to the repository root) and, optionally, a global
# directory (relative to KIRO_HOME, default ~/.kiro) onto a directory in the
# central repository: global/<central_dir>/ and projects/<slug>/<central_dir>/.
#
# include and exclude are glob patterns relative to the collection directory
# (** spans directories). lint selects the validation profile: steering,
# markdown, skill, agent, hooks, json or generic. Set enabled: false to switch a
# collection off, or add a new key to sync something else. Hidden files and
# directories are never synced.
collections:
  steering:
    description: Kiro steering documents
    workspace_path: .kiro/steering
    global_path: steering
    central_dir: steering
    include: ["**/*.md"]
    lint: steering
  specs:
    description: Spec driven development plans (requirements, design, tasks)
    workspace_path: .kiro/specs
    global_path: null
    central_dir: specs
    include: ["**/*.md"]
    lint: markdown
  skills:
    description: Agent Skills (SKILL.md with scripts, references and assets)
    workspace_path: .kiro/skills
    global_path: skills
    central_dir: skills
    include: ["**/*"]
    exclude: ["**/__pycache__/**", "**/node_modules/**"]
    lint: skill
    max_file_bytes: 1048576
  agents:
    description: Custom agent definitions and their prompt files
    workspace_path: .kiro/agents
    global_path: agents
    central_dir: agents
    include: ["**/*.json", "**/*.md"]
    lint: agent
  hooks:
    description: Standalone Kiro hooks (V3 and IDE 1.0; legacy .kiro.hook files are flagged)
    workspace_path: .kiro/hooks
    global_path: hooks
    central_dir: hooks
    include: ["**/*.json", "**/*.kiro.hook"]
    lint: hooks
  settings:
    description: Workspace settings (MCP servers, language servers)
    workspace_path: .kiro/settings
    global_path: null
    central_dir: settings
    include: ["lsp.json", "mcp.json"]
    lint: settings
  prompts:
    description: Saved prompts (slash commands, @prompt-name)
    workspace_path: .kiro/prompts
    global_path: prompts
    central_dir: prompts
    include: ["**/*.md"]
    lint: prompt
  agents-md:
    description: AGENTS.md at the repository root (read by Kiro and other agents)
    workspace_path: .
    global_path: null
    central_dir: agents-md
    include: ["AGENTS.md"]
    max_depth: 1
    lint: markdown
    git_exclude: false

sync:
  # Delete locally managed files that disappeared from the central repository.
  prune: true
  # Fail a pull when the remote content has lint errors.
  strict_pull: false
  # When the central repository is unreachable and a cache clone exists, pull from
  # the cached default branch and warn instead of failing.
  offline_fallback: true
  # Wait this long for another steersync process using the same cache clone.
  lock_timeout_seconds: 120
  # Safety limits for content read from the central repository.
  max_files: 1000
  max_total_bytes: 10485760

lint:
  max_file_bytes: 65536
  # Best practice warnings taken from the Kiro documentation (never errors). The
  # thresholds below back the size based ones; see docs/validation.md.
  practices: true
  practice_limits:
    always_file_bytes: 16384
    always_total_bytes: 49152
    auto_description_min_chars: 20
    skill_name_max_chars: 64
    skill_description_max_chars: 1024
    skill_body_max_lines: 500
    hook_timeout_max_seconds: 300
    prompt_name_max_chars: 50
  require_h1: true
  allowed_extra_keys:
    - x-steersync
  file_reference_check: true
  pymarkdown:
    enabled: true
    severity: warning
    disabled_rules:
      - MD013   # line length is not meaningful for prose steering
      - MD041   # first line heading is handled by require_h1 with front matter awareness
  forbidden_patterns:
    - id: aws-access-key
      pattern: "(?<![A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])"
      message: AWS access key identifier
    - id: private-key
      pattern: "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY"
      message: Private key material
    - id: github-token
      pattern: "gh[pousr]_[A-Za-z0-9]{36,}"
      message: GitHub token
    - id: gitlab-token
      pattern: "glpat-[A-Za-z0-9_-]{20,}"
      message: GitLab personal access token
    - id: slack-token
      pattern: "xox[abpr]-[0-9A-Za-z-]{10,}"
      message: Slack token
    - id: generic-secret
      pattern: "(?i)(api[_-]?key|secret|password|token)\\s*[:=]\\s*['\"][A-Za-z0-9/+_=-]{16,}['\"]"
      message: Possible hard coded credential

hook:
  # When true the pre-push hook aborts the project push if steering sync fails.
  strict: false
  # Per git call timeout while running from a hook, so a slow server never
  # stalls the developer's push for long.
  timeout_seconds: 60

logging:
  level: INFO
  format: text
